<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>ForgeLang — 3D Logo</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        background: #0b0b0d;
        color: #f4f3f2;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .logo-showcase {
        position: relative;
        isolation: isolate;
        width: 100%;
        min-height: min(72vw, 680px);
        overflow: hidden;
      }
      #forge-viewer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
        cursor: grab;
      }
      #forge-viewer:active { cursor: grabbing; }
      .viewer-status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        color: rgba(244, 243, 242, .7);
        font-size: .75rem;
        font-weight: 600;
        letter-spacing: .12em;
        text-transform: uppercase;
        transition: opacity .35s ease, visibility .35s ease;
      }
      .viewer-status span { display: flex; align-items: center; gap: .65rem; }
      .viewer-status span::before {
        content: "";
        width: .7rem;
        height: .7rem;
        border: 1px solid rgba(255,255,255,.25);
        border-top-color: #d83434;
        border-radius: 50%;
        animation: spin .8s linear infinite;
      }
      .viewer-status.is-hidden { opacity: 0; visibility: hidden; }
      .viewer-status.is-error { color: #f1b4b4; letter-spacing: normal; text-transform: none; }
      .viewer-status.is-error span::before { display: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (max-width: 600px) { .logo-showcase { min-height: 75vh; } }
      @media (prefers-reduced-motion: reduce) { .viewer-status span::before { animation: none; } }
    </style>
  </head>
  <body>
    <main class="logo-showcase" aria-label="Interactive ForgeLang 3D logo">
      <canvas id="forge-viewer" aria-label="Interactive 3D ForgeLang logo. Drag to rotate and scroll or pinch to zoom."></canvas>
      <div id="viewer-status" class="viewer-status" role="status"><span>Loading logo</span></div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

      const canvas = document.getElementById('forge-viewer');
      const status = document.getElementById('viewer-status');
      const container = canvas.parentElement;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(container.clientWidth, container.clientHeight, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.shadowMap.enabled = false;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 1000);
      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.065;
      controls.enablePan = false;
      controls.rotateSpeed = 0.7;
      controls.zoomSpeed = 0.85;
      controls.minPolarAngle = 0.05;
      controls.maxPolarAngle = Math.PI - 0.05;
      controls.autoRotate = false;
      controls.autoRotateSpeed = 0.42;

      // A restrained, neutral studio setup keeps the embedded GLB materials intact.
      scene.add(new THREE.HemisphereLight(0xffffff, 0x151317, 2.1));
      const key = new THREE.DirectionalLight(0xffffff, 3.4);
      key.position.set(4, 5, 6);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xd9e4ff, 1.5);
      fill.position.set(-5, 1.5, 4);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xffe6e1, 2.0);
      rim.position.set(1, 3, -5);
      scene.add(rim);

      let logo;
      let lastInteraction = performance.now();
      let framedDistance = 1;
      const resumeDelay = 1400;

      function setStatus(message, error = false) {
        status.querySelector('span').textContent = message;
        status.classList.toggle('is-error', error);
        status.classList.remove('is-hidden');
      }

      function frameObject(object) {
        const box = new THREE.Box3().setFromObject(object);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxSize = Math.max(size.x, size.y, size.z);
        const fitHeightDistance = maxSize / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
        const fitWidthDistance = fitHeightDistance / Math.max(camera.aspect, 0.5);
        framedDistance = Math.max(fitHeightDistance, fitWidthDistance) * 1.28;

        controls.target.copy(center);
        camera.position.set(center.x + framedDistance * 0.06, center.y + framedDistance * 0.025, center.z + framedDistance);
        camera.near = Math.max(framedDistance / 100, 0.001);
        camera.far = Math.max(framedDistance * 100, 100);
        controls.minDistance = Math.max(framedDistance * 0.38, maxSize * 0.1);
        controls.maxDistance = framedDistance * 3.5;
        camera.updateProjectionMatrix();
        controls.update();
      }

      function resize() {
        const { clientWidth: width, clientHeight: height } = container;
        if (!width || !height) return;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(width, height, false);
        if (logo) frameObject(logo);
      }

      controls.addEventListener('start', () => {
        lastInteraction = performance.now();
        controls.autoRotate = false;
      });
      controls.addEventListener('change', () => { lastInteraction = performance.now(); });
      canvas.addEventListener('wheel', () => { lastInteraction = performance.now(); controls.autoRotate = false; }, { passive: true });
      window.addEventListener('resize', resize, { passive: true });

      new GLTFLoader().load(
        '../assets/3d/ForgeLang-logo.glb',
        (gltf) => {
          logo = gltf.scene;
          logo.traverse((node) => {
            if (node.isMesh) {
              node.frustumCulled = true;
              // GLTFLoader preserves every material authored in the file.
            }
          });
          scene.add(logo);
          resize();
          status.classList.add('is-hidden');
        },
        undefined,
        (error) => {
          console.error('ForgeLang GLB failed to load from ../assets/3d/ForgeLang-logo.glb', error);
          setStatus('Unable to load the 3D logo.', true);
        }
      );

      function render(now) {
        requestAnimationFrame(render);
        if (logo && !reducedMotion && now - lastInteraction > resumeDelay) controls.autoRotate = true;
        controls.update();
        renderer.render(scene, camera);
      }
      requestAnimationFrame(render);

      window.addEventListener('pagehide', () => {
        controls.dispose();
        renderer.dispose();
      }, { once: true });
    </script>
  </body>
</html>
