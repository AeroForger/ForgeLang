[package]
name = "furnace"
version = "0.3.4"
edition = "2021"
description = "Compiler for the ForgeLang systems programming language"
license = "GPL-3.0-only"
repository = "github.com/AeroForger/ForgeLang"

[lib]
name = "furnace"
path = "src/lib.rs"

[[bin]]
name = "furnace"
path = "Cli/main.rs"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
rayon = "1.11"
cranelift = "0.135.1"
cranelift-codegen = "0.135.1"
cranelift-frontend = "0.135.1"
cranelift-module = "0.135.1"
cranelift-object = "0.135.1"
cranelift-native = "0.135.1"
target-lexicon = "0.13.5"

[profile.release]
opt-level = 3