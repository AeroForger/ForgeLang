[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "furnace-compiler"
version = "0.2.0"
description = "ForgeLang compiler: .anvil source to native executables via LLVM"
requires-python = ">=3.10"
dependencies = [
    "antlr4-python3-runtime",
    "llvmlite",
]

[project.scripts]
furnace = "furnace.cli:main"

[tool.setuptools.packages.find]
include = ["furnace*"]